<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Snap News Swipe Review</title>
    <style>
        :root {
            --bg-0: #070b12;
            --bg-1: #0f1726;
            --bg-2: #162235;
            --panel: rgba(16, 24, 39, 0.84);
            --ink: #e8eef9;
            --muted: #9eb0c8;
            --card: #131d2d;
            --card-2: #101726;
            --yes: #1a9f62;
            --no: #cf4c4c;
            --line: #2d3f59;
            --accent: #4676b5;
            --shadow: 0 22px 40px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at 10% 10%, rgba(44, 94, 152, 0.22), transparent 42%),
                radial-gradient(circle at 85% 86%, rgba(30, 132, 84, 0.16), transparent 36%),
                linear-gradient(165deg, var(--bg-0), var(--bg-1) 45%, var(--bg-2));
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
        }

        .app {
            width: min(940px, 100%);
            background: var(--panel);
            border: 1px solid #324965;
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 18px;
            box-shadow: var(--shadow);
        }

        .toolbar-hidden {
            display: none;
        }

        .toolbar {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .file-wrap {
            border: 2px dashed var(--line);
            border-radius: 12px;
            padding: 10px 12px;
            background: rgba(19, 30, 48, 0.85);
            font-size: 0.9rem;
        }

        input[type="file"] {
            width: 100%;
            font-size: 0.9rem;
            color: var(--ink);
        }

        .meta {
            text-align: right;
            color: var(--muted);
            font-size: 0.9rem;
            min-width: 220px;
        }

        .stage {
            position: relative;
            height: min(72vh, 720px);
            border-radius: 14px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, #101827, #0d1522);
            overflow: hidden;
            display: grid;
            place-items: center;
            padding: 14px;
        }

        .placeholder {
            color: var(--muted);
            text-align: center;
            max-width: 620px;
            line-height: 1.45;
        }

        .card {
            width: min(700px, 100%);
            height: 100%;
            background: linear-gradient(180deg, var(--card), var(--card-2));
            border: 1px solid #32465f;
            border-radius: 14px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            padding: 18px;
            user-select: none;
            touch-action: none;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 10px;
            transition: transform 180ms ease;
        }

        .title {
            margin: 0;
            font-size: clamp(1.35rem, 3.2vw, 2rem);
            line-height: 1.24;
        }

        .description {
            margin: 0;
            overflow: auto;
            line-height: 1.55;
            font-size: clamp(1.05rem, 2.4vw, 1.25rem);
            color: #d5e2f5;
            white-space: pre-wrap;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .pill {
            border: 1px solid #33506d;
            border-radius: 999px;
            padding: 2px 8px;
            background: rgba(24, 38, 58, 0.9);
        }

        .pill a {
            color: #9ac8ff;
        }

        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        button {
            border: 1px solid transparent;
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 0.95rem;
            cursor: pointer;
            color: #fff;
            min-width: 120px;
            transition: transform 120ms ease, opacity 120ms ease;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no {
            background: var(--no);
        }

        .yes {
            background: var(--yes);
        }

        .undo {
            background: var(--accent);
        }

        .export {
            background: #618734;
            min-width: 180px;
        }

        .badge {
            position: absolute;
            top: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            font-size: 1.1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 120ms ease;
        }

        .badge.no {
            left: 28px;
            color: #ff8f8f;
            border: 2px solid var(--no);
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(25, 10, 10, 0.88);
        }

        .badge.yes {
            right: 28px;
            color: #95e8bd;
            border: 2px solid var(--yes);
            padding: 4px 8px;
            border-radius: 8px;
            background: rgba(10, 26, 16, 0.88);
        }

        @media (max-width: 760px) {
            .toolbar {
                grid-template-columns: 1fr;
            }

            .meta {
                text-align: left;
                min-width: 0;
            }

            .stage {
                height: min(76vh, 760px);
            }

            .card {
                padding: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="app">
        <div class="toolbar" id="uploadToolbar">
            <label class="file-wrap">
                <strong>Load CSV</strong>
                <input id="fileInput" type="file" accept=".csv,text/csv">
            </label>
            <div class="meta" id="meta">No file loaded.</div>
        </div>

        <section class="stage" id="stage">
            <div class="placeholder" id="placeholder">
                Drop CSV
            </div>
            <div class="badge no" id="badgeNo">NO</div>
            <div class="badge yes" id="badgeYes">YES</div>
        </section>

        <div class="actions">
            <button class="undo" id="undoBtn" disabled>Undo (Z)</button>
            <button class="export" id="exportBtn" disabled>Export With IsOnTopic</button>
        </div>
    </main>

    <script>
        const fileInput = document.getElementById("fileInput");
        const uploadToolbar = document.getElementById("uploadToolbar");
        const stage = document.getElementById("stage");
        const meta = document.getElementById("meta");
        const placeholder = document.getElementById("placeholder");
        const undoBtn = document.getElementById("undoBtn");
        const exportBtn = document.getElementById("exportBtn");
        const badgeNo = document.getElementById("badgeNo");
        const badgeYes = document.getElementById("badgeYes");

        let allRows = [];
        let reviewQueue = [];
        let index = 0;
        let decisions = [];
        let cardEl = null;
        let originalHeaders = [];
        let headerLookup = {};
        let isOnTopicHeader = "IsOnTopic";
        let detectedDelimiter = ",";

        const drag = {
            active: false,
            startX: 0,
            dx: 0
        };

        function escapeHtml(text) {
            return String(text ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function detectDelimiter(headerLine) {
            const options = [",", "\t", ";", "|"];
            let best = ",";
            let bestScore = -1;
            for (const delim of options) {
                const score = headerLine.split(delim).length;
                if (score > bestScore) {
                    best = delim;
                    bestScore = score;
                }
            }
            return best;
        }

        function parseDelimited(text, delimiter) {
            const out = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i += 1) {
                const c = text[i];
                const next = text[i + 1];

                if (c === '"') {
                    if (inQuotes && next === '"') {
                        field += '"';
                        i += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                    continue;
                }

                if (!inQuotes && c === delimiter) {
                    row.push(field);
                    field = "";
                    continue;
                }

                if (!inQuotes && (c === "\n" || c === "\r")) {
                    if (c === "\r" && next === "\n") {
                        i += 1;
                    }
                    row.push(field);
                    out.push(row);
                    row = [];
                    field = "";
                    continue;
                }

                field += c;
            }

            if (field.length > 0 || row.length > 0) {
                row.push(field);
                out.push(row);
            }

            return out;
        }

        function buildRowsFromText(text) {
            const firstLine = text.split(/\r?\n/, 1)[0] || "";
            detectedDelimiter = detectDelimiter(firstLine);
            const table = parseDelimited(text, detectedDelimiter).filter((r) => r.some((c) => String(c).trim() !== ""));

            if (table.length < 2) {
                throw new Error("CSV appears empty or missing data rows.");
            }

            originalHeaders = table[0].map((h) => String(h).trim());
            headerLookup = {};
            for (const header of originalHeaders) {
                const lowered = header.toLowerCase();
                if (!headerLookup[lowered]) {
                    headerLookup[lowered] = header;
                }
            }

            const titleHeader = headerLookup.title;
            const descriptionHeader = headerLookup.description;
            if (!titleHeader || !descriptionHeader) {
                throw new Error("Missing required headers: title and description.");
            }

            isOnTopicHeader = headerLookup.isontopic || "IsOnTopic";

            allRows = table.slice(1).map((line) => {
                const rec = {};
                originalHeaders.forEach((h, i) => {
                    rec[h] = line[i] ?? "";
                });
                if (headerLookup.isontopic) {
                    rec[isOnTopicHeader] = rec[isOnTopicHeader] ?? "";
                }
                return rec;
            });

            reviewQueue = allRows
                .map((_, rowIdx) => rowIdx)
                .filter((rowIdx) => {
                    const row = allRows[rowIdx];
                    const title = String(row[titleHeader] ?? "").trim();
                    const alreadyReviewed = String(row[isOnTopicHeader] ?? "").trim() !== "";
                    return title.length > 0 && !alreadyReviewed;
                });

            index = 0;
            decisions = [];
        }

        function getByHeader(row, loweredHeader) {
            const actualHeader = headerLookup[loweredHeader];
            if (!actualHeader) {
                return "";
            }
            return row[actualHeader] ?? "";
        }

        function setIsOnTopic(row, value) {
            row[isOnTopicHeader] = value;
        }

        function reviewedCount() {
            return allRows.filter((r) => String(r[isOnTopicHeader] ?? "").trim() !== "").length;
        }

        function setButtons() {
            const hasData = allRows.length > 0;
            const inRange = hasData && index < reviewQueue.length;
            undoBtn.disabled = decisions.length === 0;
            exportBtn.disabled = allRows.length === 0;
            stage.style.pointerEvents = inRange ? "auto" : "auto";
        }

        function progressText() {
            if (allRows.length === 0) {
                return "No file loaded.";
            }
            const reviewed = reviewedCount();
            const pending = Math.max(0, reviewQueue.length - index);
            return "Reviewed " + reviewed + " / " + allRows.length + " | Remaining " + pending;
        }

        function updateMeta(extra) {
            meta.textContent = extra ? progressText() + " | " + extra : progressText();
        }

        function makeCard(row) {
            const wrapper = document.createElement("article");
            wrapper.className = "card";

            const title = escapeHtml(getByHeader(row, "title") || "(no title)");
            const description = escapeHtml(getByHeader(row, "description") || "(no description)");
            const source = escapeHtml(getByHeader(row, "source") || "n/a");
            const id = escapeHtml(getByHeader(row, "id") || "n/a");
            const publishDate = escapeHtml(getByHeader(row, "publish_date") || "n/a");
            const linkValue = getByHeader(row, "link");
            const link = linkValue ? "<a href=\"" + escapeHtml(linkValue) + "\" target=\"_blank\" rel=\"noopener\">Open link</a>" : "No link";

            wrapper.innerHTML = ""
                + "<h2 class=\"title\">" + title + "</h2>"
                + "<p class=\"description\">" + description + "</p>"
                + "<div class=\"row\">"
                + "<span class=\"pill\">id: " + id + "</span>"
                + "<span class=\"pill\">source: " + source + "</span>"
                + "<span class=\"pill\">publish: " + publishDate + "</span>"
                + "<span class=\"pill\">" + link + "</span>"
                + "</div>";

            wrapper.addEventListener("pointerdown", onPointerDown);
            wrapper.addEventListener("pointermove", onPointerMove);
            wrapper.addEventListener("pointerup", onPointerUp);
            wrapper.addEventListener("pointercancel", onPointerCancel);

            return wrapper;
        }

        function render() {
            if (cardEl) {
                cardEl.remove();
                cardEl = null;
            }

            badgeNo.style.opacity = "0";
            badgeYes.style.opacity = "0";

            if (allRows.length === 0) {
                placeholder.style.display = "block";
                placeholder.textContent = "Drop CSV";
                updateMeta();
                setButtons();
                return;
            }

            if (index >= reviewQueue.length) {
                placeholder.style.display = "block";
                const yesCount = allRows.filter((r) => String(r[isOnTopicHeader]).toLowerCase() === "yes").length;
                const noCount = allRows.filter((r) => String(r[isOnTopicHeader]).toLowerCase() === "no").length;
                placeholder.textContent = "Review complete for pending rows. Yes: " + yesCount + ", No: " + noCount + ". Export when ready.";
                updateMeta("Done");
                setButtons();
                return;
            }

            placeholder.style.display = "none";
            const row = allRows[reviewQueue[index]];
            cardEl = makeCard(row);
            stage.appendChild(cardEl);
            updateMeta();
            setButtons();
        }

        function recordDecision(direction) {
            if (index >= reviewQueue.length) {
                return;
            }

            const rowIndex = reviewQueue[index];
            const row = allRows[rowIndex];
            const previous = String(row[isOnTopicHeader] ?? "");
            const newValue = direction === "yes" ? "Yes" : "No";

            setIsOnTopic(row, newValue);
            decisions.push({
                queueIndex: index,
                rowIndex,
                previous
            });

            index += 1;
            render();
        }

        function animateAndRecord(direction) {
            if (!cardEl) {
                return;
            }
            const x = direction === "yes" ? 560 : -560;
            const rotate = direction === "yes" ? 18 : -18;
            cardEl.style.transition = "transform 180ms ease";
            cardEl.style.transform = "translateX(" + x + "px) rotate(" + rotate + "deg)";
            setTimeout(() => recordDecision(direction), 170);
        }

        function undo() {
            const last = decisions.pop();
            if (!last) {
                return;
            }

            index = last.queueIndex;
            const row = allRows[last.rowIndex];
            setIsOnTopic(row, last.previous);
            render();
        }

        function onPointerDown(e) {
            if (!cardEl) {
                return;
            }
            drag.active = true;
            drag.startX = e.clientX;
            drag.dx = 0;
            cardEl.style.transition = "none";
            cardEl.setPointerCapture(e.pointerId);
        }

        function onPointerMove(e) {
            if (!drag.active || !cardEl) {
                return;
            }
            drag.dx = e.clientX - drag.startX;
            const rotate = drag.dx * 0.04;
            cardEl.style.transform = "translateX(" + drag.dx + "px) rotate(" + rotate + "deg)";
            if (drag.dx > 30) {
                badgeYes.style.opacity = "1";
                badgeNo.style.opacity = "0";
            } else if (drag.dx < -30) {
                badgeNo.style.opacity = "1";
                badgeYes.style.opacity = "0";
            } else {
                badgeNo.style.opacity = "0";
                badgeYes.style.opacity = "0";
            }
        }

        function onPointerUp(e) {
            if (!drag.active || !cardEl) {
                return;
            }
            drag.active = false;
            badgeNo.style.opacity = "0";
            badgeYes.style.opacity = "0";

            const threshold = 52;
            if (drag.dx > threshold) {
                animateAndRecord("yes");
            } else if (drag.dx < -threshold) {
                animateAndRecord("no");
            } else {
                cardEl.style.transition = "transform 160ms ease";
                cardEl.style.transform = "translateX(0) rotate(0)";
            }
            try {
                cardEl.releasePointerCapture(e.pointerId);
            } catch (err) {
                // Ignore when capture is already released by browser.
            }
        }

        function onPointerCancel() {
            if (!drag.active || !cardEl) {
                return;
            }
            drag.active = false;
            badgeNo.style.opacity = "0";
            badgeYes.style.opacity = "0";
            cardEl.style.transition = "transform 160ms ease";
            cardEl.style.transform = "translateX(0) rotate(0)";
        }

        function csvEscape(value) {
            const s = String(value ?? "");
            const needsQuotes = s.includes(detectedDelimiter) || /["\n\r]/.test(s);
            if (needsQuotes) {
                return '"' + s.replaceAll('"', '""') + '"';
            }
            return s;
        }

        function downloadCsv(filename, text) {
            const blob = new Blob([text], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function exportDataset() {
            if (allRows.length === 0) {
                return;
            }

            const headersForExport = [...originalHeaders];
            if (!headersForExport.some((h) => h.toLowerCase() === "isontopic")) {
                headersForExport.push("IsOnTopic");
                isOnTopicHeader = "IsOnTopic";
            }

            const lines = [headersForExport.map(csvEscape).join(detectedDelimiter)];

            for (const row of allRows) {
                if (row[isOnTopicHeader] == null) {
                    row[isOnTopicHeader] = "";
                }
                const line = headersForExport.map((header) => csvEscape(row[header] ?? ""));
                lines.push(line.join(detectedDelimiter));
            }

            const stamp = new Date().toISOString().replaceAll(":", "-").replace(".", "_");
            downloadCsv("swipe-progress-" + stamp + ".csv", lines.join("\n"));
        }

        async function loadFromFile(file) {
            const text = await file.text();
            buildRowsFromText(text);
            uploadToolbar.classList.add("toolbar-hidden");
            render();

            const skippedReviewed = allRows.length - reviewQueue.length;
            updateMeta(file.name + " loaded | skipped pre-reviewed/blank-title: " + skippedReviewed);
        }

        function resetStateWithError(message) {
            allRows = [];
            reviewQueue = [];
            index = 0;
            decisions = [];
            originalHeaders = [];
            headerLookup = {};
            isOnTopicHeader = "IsOnTopic";
            detectedDelimiter = ",";
            uploadToolbar.classList.remove("toolbar-hidden");
            render();
            alert(message);
        }

        fileInput.addEventListener("change", async (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) {
                return;
            }
            try {
                await loadFromFile(file);
            } catch (err) {
                resetStateWithError("Could not read file: " + (err && err.message ? err.message : "Unknown error"));
            }
        });

        stage.addEventListener("dragover", (e) => {
            e.preventDefault();
        });

        stage.addEventListener("drop", async (e) => {
            e.preventDefault();
            const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
            if (!file) {
                return;
            }
            try {
                await loadFromFile(file);
            } catch (err) {
                resetStateWithError("Could not read file: " + (err && err.message ? err.message : "Unknown error"));
            }
        });

        undoBtn.addEventListener("click", undo);
        exportBtn.addEventListener("click", exportDataset);

        window.addEventListener("keydown", (e) => {
            if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
                return;
            }
            if (e.key === "ArrowLeft") {
                animateAndRecord("no");
            } else if (e.key === "ArrowRight") {
                animateAndRecord("yes");
            } else if (e.key.toLowerCase() === "z") {
                undo();
            }
        });

        render();
    </script>
</body>

</html>
